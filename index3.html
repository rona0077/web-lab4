<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расчет стоимости - Pixel Dream</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Анимационная студия "Pixel Dream"</h1>
        <p>Узнайте, сколько будет стоить ваш проект</p>
    </header>

    <nav>
        <a href="index.html">Главная</a>
        <a href="index2.html">О студии</a>
        <a href="index3.html">Расчет стоимости</a>
    </nav>

    <div class="we">
        <h2>Калькулятор стоимости анимации</h2>
        
        <form id="calcForm" onsubmit="calculateTotal(event)">
            <div class="form-group">
                <label for="type">Тип анимации:</label>
                <select id="type">
                    <option value="1500">2D анимация (базовая) - 1500 руб/сек</option>
                    <option value="2500">3D анимация - 2500 руб/сек</option>
                    <option value="1000">Моушн-дизайн - 1000 руб/сек</option>
                </select>
            </div>

            <div class="form-group">
                <label for="duration">Длительность ролика (в секундах):</label>
                <input type="number" id="duration" min="1" max="120" value="10" required>
            </div>

            <button type="submit" class="btn-anim">Рассчитать стоимость</button>
        </form>

        <div id="result-box" class="result-box">
            <h3 style="margin: 0 0 5px 0;">Итоговая стоимость:</h3>
            <p id="result-text" style="margin: 0; font-size: 18px; font-weight: bold;"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
